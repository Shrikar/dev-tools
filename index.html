<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All-in-one browser developer tools for JWT, hashing, JSON compare, JSON format, YAML conversion, and cron expression workflows." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="Dev Tools" />
    <meta property="og:description" content="Browser-only utilities for everyday developer workflows." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shrikar.github.io/dev-tools/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Dev Tools</title>
    <link rel="canonical" href="https://shrikar.github.io/dev-tools/" />
    <link rel="icon" type="image/svg+xml" href="/dev-tools/favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Dev Tools",
        "url": "https://shrikar.github.io/dev-tools/",
        "description": "All-in-one browser developer tools for JSON, JWT, hashing, YAML, cron, URL, and Base64 workflows."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Dev Tools",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "https://shrikar.github.io/dev-tools/",
        "description": "Developer-focused web tools including JSON formatter/compare/path/escape, JWT decoder, YAML-JSON converter, and cron helper."
      }
    </script>
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
